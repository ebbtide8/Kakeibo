<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿</title><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2f9e5b"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="家計簿">
<style>
:root{--bg:#f4f5f6;--card:#fff;--tx:#1a1a1a;--red:#d12c2c;--gray:#6b7280;--gl:#e5e7eb;--g:#2f9e5b;--h:#2b6cb0;--w:#dd7a1f;--hb:#e6effa;--wb:#fdf0e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#202327;--tx:#f0f0f0;--red:#ff6b6b;--gray:#9aa1ab;--gl:#33383e;--hb:#1c2a3b;--wb:#3a2a19;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#top{padding:10px 14px 6px;text-align:center}
#top small{color:var(--gray)}#total{font-size:24px;font-weight:700;line-height:1.2}
.neg{color:var(--red)}
#bar{display:flex;flex-wrap:nowrap;gap:6px;justify-content:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--gl)}
button{font:inherit;cursor:pointer}
.sm{background:var(--gl);color:var(--tx);border:0;border-radius:8px;padding:6px 9px;font-size:13px;white-space:nowrap}
#cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px;overflow-y:auto;align-content:start}
.col{background:var(--card);border-radius:12px;padding:10px;min-width:0}
.col.h{border-top:5px solid var(--h)}.col.w{border-top:5px solid var(--w)}
.who{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.h .who{color:var(--h)}.w .who{color:var(--w)}
.ic{width:34px;height:34px;border-radius:50%;background:var(--gl);object-fit:cover;flex:none;display:grid;place-items:center;overflow:hidden;border:0;padding:0;font-size:14px;color:var(--gray)}
.ic.s{width:26px;height:26px;font-size:11px}
.ic img{width:100%;height:100%;object-fit:cover}
.acc{display:flex;align-items:center;gap:10px;width:100%;border-bottom:1px solid var(--gl);padding:8px 4px;color:var(--tx);cursor:pointer;border-radius:6px}
.acc:hover{background:var(--gl)}
.acc .n{font-size:13px;color:var(--gray)}
.acc .tx{min-width:0;flex:1}
.acc .v{font-size:19px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.ic[data-ic]{cursor:pointer;outline:2px dashed var(--gray)}
.acc .v[data-init]{text-decoration:underline dashed;cursor:pointer}
#total{cursor:pointer}
.h .acc .n b,.w .acc .n b{font-weight:400}
input.nm{font:inherit;width:100%;min-width:0;border:1px solid var(--gl);border-radius:6px;padding:3px 6px;background:var(--bg);color:var(--tx)}
.sync{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:8px;font-size:11px;color:var(--gray)}
.sync.warn{color:var(--tx);background:var(--gl);border-radius:6px;padding:4px}
.fb{display:block;margin:8px 8px 0;height:50px;border:0;border-radius:12px;color:#fff;font-size:17px;font-weight:700;width:calc(100% - 16px)}
.fb svg{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
#add{background:var(--g);margin-bottom:8px}
#foot{padding-bottom:env(safe-area-inset-bottom,0px)}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.dlg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 10px;font-size:17px}
label{display:block;font-size:12px;color:var(--gray);margin:10px 0 3px}
select,input[type=date],input[type=number],input[type=text]{width:100%;font:inherit;padding:9px;border:1px solid var(--gl);border-radius:8px;background:var(--bg);color:var(--tx)}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px;border:1px solid var(--gl);border-radius:8px;background:var(--bg);color:var(--tx)}
.seg button.on{background:var(--g);color:#fff;border-color:var(--g)}
.seg button.on[data-t="収入"]{background:#000;border-color:var(--tx)}
.seg button.on[data-t="支出"]{background:#d12c2c;border-color:#d12c2c}
.ok{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:var(--g);color:#fff;font-weight:700;font-size:16px}
.cl{background:var(--gl);color:var(--tx);margin-top:8px}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--gl)}
.row small{display:block;color:var(--gray)}
.row.fut{opacity:.7}
.star{color:#f08a00;font-weight:700}
#srch{background:var(--h)}
#sync{background:#d12c2c}
.row[data-tx]{cursor:pointer;border-radius:6px;padding-left:4px;padding-right:4px}
.row[data-tx]:hover{background:var(--gl)}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--gray);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;display:none;z-index:9;max-width:90%}
@media (max-width:360px){.acc .v{font-size:16px}}
</style></head><body>
<div id="top"><small>2人の合計残高(タップで将来の合計)</small><div id="total">¥ 0</div>
<div id="bar"><button class="sm" id="edit">口座編集</button><button class="sm" id="csv">CSV出力</button><button class="sm" id="hide">金額非表示</button><button class="sm" id="cfg">同期設定</button></div></div>
<div id="cols"><div class="col h" id="ch"></div><div class="col w" id="cw"></div></div>
<div id="foot"><button class="fb" id="sync"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 19a4.5 4.5 0 0 1-.6-8.96 6 6 0 0 1 11.5-1.5A4.8 4.8 0 0 1 17.5 19z"/></svg>同期</button><button class="fb" id="srch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>履歴を検索</button><button class="fb" id="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>入力</button></div>
<div class="dlg" id="d1"><div class="sheet" id="s1"></div></div>
<div class="dlg" id="d2"><div class="sheet" id="s2"></div></div>
<div id="msg"></div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="csvf" accept=".csv,.txt,text/csv" hidden>
<script>
const ACC=['財布','銀行口座A','銀行口座B','銀行口座C','クレジット','交通系IC'];
const INC=['給与','営業','臨時収入','パート代'];
const EXP={未設定:0,食費:0,交通費:0,交際費:0,消耗品:0,雑費:0,図書費:0,地代家賃:['家賃','駐輪場代'],通信費:['携帯電話','インターネット','衛星放送','切手'],光熱費:['水道','電気','ガス'],保険年金:['国民健康保険','全労済','火災保険'],医療費:0,荷台運賃:0};
const KEY='kakeibo-v1';let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S){S={names:{h:'夫',w:'妻'},icons:{},acc:{},tx:[],sync:null};['h','w'].forEach(o=>ACC.forEach((a,i)=>S.acc[o+i]=a))}
S.tx.forEach(t=>{if(typeof t.id!=='string')t.id=mkId();if(!t.updated)t.updated=Date.now()});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){msg('保存できません。ブラウザの容量を確認してください。')}};
const $=id=>document.getElementById(id);
const yen=n=>S.hide?'¥ ••••':'¥ '+n.toLocaleString('ja-JP');
const ids=[...[0,1,2,3,4,5].map(i=>'h'+i),...[0,1,2,3,4,5].map(i=>'w'+i)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function msg(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',2800)}
const todayStr=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function bal(id,all){let b=(S.init&&S.init[id])||0;const td=todayStr();S.tx.forEach(t=>{if(!all&&t.date>td)return;if(t.type==='収入'&&t.acct===id)b+=t.amount;else if(t.type==='支出'&&t.acct===id)b-=t.amount;else if(t.type==='振替'){if(t.acct===id)b-=t.amount;if(t.to===id)b+=t.amount}});return b}
const icon=(k)=>`<span class="ic" ${editing?`data-ic="${k}"`:''}>${S.icons[k]?`<img src="${S.icons[k]}" alt="">`:(editing?'画像':'')}</span>`;
let editing=false;
function render(){
 let tot=0;
 ['h','w'].forEach(o=>{
  let h=`<div class="who">${icon(o)}${editing?`<input class="nm" data-nm="${o}" value="${esc(S.names[o])}">`:`<span>${esc(S.names[o])}</span>`}</div>`;
  for(let i=0;i<6;i++){const id=o+i,b=bal(id);tot+=b;
   h+=`<div class="acc" data-ac="${id}">${icon(id)}<div class="tx"><div class="n">${editing?`<input class="nm" data-an="${id}" value="${esc(S.acc[id])}">`:esc(S.acc[id])}</div><div class="v ${b<0?'neg':''}" ${editing?`data-init="${id}"`:''}>${yen(b)}</div></div></div>`}
  const stale=S.sync===null;
  h+=`<div class="sync ${stale?'warn':''}"><span>${S.sync?'最終同期 '+new Date(S.sync).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'未同期の保存があります'}</span></div>`;
  $('c'+o).innerHTML=h});
 const t=$('total');t.textContent=yen(tot);t.className=tot<0?'neg':'';
 $('edit').textContent=editing?'編集終了':'口座編集';$('hide').textContent=S.hide?'金額表示':'金額非表示'}
let iconTarget=null;
document.addEventListener('click',e=>{
 const ic=e.target.closest('[data-ic]');if(ic){iconMenu(ic.dataset.ic);return}
 if(e.target.closest('[data-cloud]')){doSync(true);return}
 const iv=e.target.closest('[data-init]');if(iv){initMenu(iv.dataset.init);return}
 const tr=e.target.closest('[data-tx]');if(tr){editTx(tr.dataset.tx);return}
 const ac=e.target.closest('[data-ac]');if(ac&&!editing&&!e.target.closest('input'))hist(ac.dataset.ac)});
$('file').onchange=e=>{const f=e.target.files[0];if(!f||!iconTarget)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);S.icons[iconTarget]=c.toDataURL('image/jpeg',.8);touch('icon:'+iconTarget);save();render()};im.src=r.result};r.readAsDataURL(f);e.target.value=''};
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.nm){S.names[t.dataset.nm]=t.value;touch('name:'+t.dataset.nm);save()}if(t.dataset.an){S.acc[t.dataset.an]=t.value;touch('acc:'+t.dataset.an);save()}});
$('edit').onclick=()=>{editing=!editing;render()};
$('hide').onclick=()=>{S.hide=!S.hide;save();render()};
$('total').onclick=()=>{const a=ids.reduce((s,i)=>s+bal(i),0),f=ids.reduce((s,i)=>s+bal(i,true),0);
 $('s2').innerHTML=`<h2>2人の合計</h2><div class="row"><span>現在の合計</span><b class="${a<0?'neg':''}">${yen(a)}</b></div><div class="row" style="opacity:.7"><span>将来の合計</span><b class="${f<0?'neg':''}">${yen(f)}</b></div><button class="ok cl" id="x2">閉じる</button>`;$('d2').classList.add('on');$('x2').onclick=()=>$('d2').classList.remove('on')};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(!editing)render();doSync(false)}});
const owner=id=>S.names[id[0]];
const an=id=>owner(id)+'の'+S.acc[id];
function hist(id){
 const L=S.tx.filter(t=>t.acct===id||t.to===id).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 histAcct=id;backFn=()=>hist(id);const b1=bal(id),b2=bal(id,true);
 let h=`<h2>${esc(an(id))}の履歴</h2><div class="row"><span>現在の合計</span><b class="${b1<0?'neg':''}">${yen(b1)}</b></div><div class="row" style="opacity:.7"><span>将来の合計</span><b class="${b2<0?'neg':''}">${yen(b2)}</b></div>`;
 if(!L.length)h+='<p style="color:var(--gray)">まだ履歴がありません。下の「入力」から登録できます。</p>';
 L.forEach(t=>{const v=t.type==='収入'?t.amount:t.type==='支出'?-t.amount:(t.acct===id?-t.amount:t.amount);
  h+=`<div class="row ${t.date>todayStr()?'fut':''}" data-tx="${t.id}"><div>${t.date}${t.date>todayStr()?'(予定)':''}　${t.type}${t.subject?'・'+esc(t.subject):''}${t.item?'・'+esc(t.item):''}${t.star?' <span class="star">★</span>':''}<small>${esc([t.shop,t.memo].filter(Boolean).join(' / '))}${t.type==='振替'?esc(t.acct===id?'→ '+an(t.to):'← '+an(t.acct)):''}</small></div><b class="${v<0?'neg':''}">${yen(v)}</b></div>`});
 if(/^[hw]4$/.test(id))h+='<button class="ok" id="csvi" style="background:#2b6cb0">CSV読み込み</button>';
 if(/^[hw][45]$/.test(id))h+='<button class="ok" id="sch">翌月10日の振替予定を自動入力</button>';h+='<button class="ok cl" id="x2">閉じる</button>';$('s2').innerHTML=h;$('d2').classList.add('on');if($('sch'))$('sch').onclick=()=>sched(id);if($('csvi'))$('csvi').onclick=()=>{csvTarget=id;$('csvf').click()};$('x2').onclick=()=>$('d2').classList.remove('on')}
$('d2').onclick=e=>{if(e.target.id==='d2')$('d2').classList.remove('on')};
$('d1').onclick=e=>{if(e.target.id==='d1')closeForm()};
const opts=(a,sel)=>a.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
const accOpts=()=>ids.map(i=>`<option value="${i}">${esc(an(i))}</option>`).join('');
let type='支出',editId=null,histAcct=null,backFn=null;
function closeForm(){$('d1').classList.remove('on');const b=editId;editId=null;if(b&&backFn)backFn()}
function shopUI(cur){const sj=$('sj').value,seen=[];S.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).forEach(t=>{if(t.subject===sj&&t.shop&&!seen.includes(t.shop)&&seen.length<10)seen.push(t.shop)});
 const s=$('shs');s.innerHTML='<option value="">(お店なし)</option>'+seen.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')+'<option value="__new">新規入力…</option>';
 const v=cur===undefined?(seen.length?'':'__new'):(cur===''?'':seen.includes(cur)?cur:'__new');s.value=v;$('sh').style.display=v==='__new'?'':'none';if(cur&&v==='__new')$('sh').value=cur}
const pad=n=>String(n).padStart(2,'0');
function baseHol(y,m,d){const w=new Date(y,m-1,d).getDay(),n=Math.ceil(d/7),mon=w===1,k=m*100+d,q=Math.floor((y-1980)/4);
 if([101,211,223,429,503,504,505,811,1103,1123].includes(k))return true;
 if(mon&&((m===1&&n===2)||(m===7&&n===3)||(m===9&&n===3)||(m===10&&n===2)))return true;
 if(m===3&&d===Math.floor(20.8431+.242194*(y-1980)-q))return true;
 if(m===9&&d===Math.floor(23.2488+.242194*(y-1980)-q))return true;return false}
const bh=dt=>baseHol(dt.getFullYear(),dt.getMonth()+1,dt.getDate());
function isHol(y,m,d){const dt=new Date(y,m-1,d),w=dt.getDay();if(w===0||w===6||(m===12&&d===31)||(m===1&&d<=3)||bh(dt))return true;
 let p=new Date(y,m-1,d-1);while(bh(p)){if(p.getDay()===0)return true;p=new Date(p.getFullYear(),p.getMonth(),p.getDate()-1)}
 return bh(new Date(y,m-1,d-1))&&bh(new Date(y,m-1,d+1))}
function settleDate(y,m){let d=10;while(isHol(y,m,d))d++;return y+'-'+pad(m)+'-'+pad(d)}
function sched(id){const src=id[1]==='4'?id[0]+'1':'h1',td=todayStr(),sum={};
 S.tx.forEach(t=>{if(t.acct!==id||(t.type!=='支出'&&t.type!=='収入'))return;let[y,m]=t.date.split('-').map(Number);m++;if(m>12){m=1;y++}let sd=settleDate(y,m);if(sd<td){let ty=+td.slice(0,4),tm=+td.slice(5,7)+1;if(tm>12){tm=1;ty++}sd=settleDate(ty,tm)}sum[sd]=(sum[sd]||0)+(t.type==='支出'?t.amount:-t.amount)});
 let add=0,dup=0;Object.keys(sum).sort().forEach(sd=>{const a=sum[sd];if(a<=0)return;if(S.tx.some(t=>t.type==='振替'&&t.to===id&&t.date===sd)){dup++;return}S.tx.push({id:mkId(),updated:Date.now(),date:sd,type:'振替',acct:src,to:id,amount:a});add++});
 if(add){S.sync=null;save();render()}hist(id);
 msg(add?add+'件の振替予定を登録しました。'+(dup?'(登録済み'+dup+'件は除く)':''):dup?'すでに振替予定が登録されているため、二重登録しませんでした。':'振替予定にできる支出がありません。')}
let csvTarget=null;
function initMenu(id){const cur=(S.init&&S.init[id])||0;$('s2').innerHTML=`<h2>${esc(an(id))}の初期設定金額</h2><p style="color:var(--gray);font-size:13px;margin:0">この金額に履歴の収入・支出・振替を加減して残高を計算します。履歴やCSV出力の内容は変わりません。</p><label>初期設定金額(円)</label><input type="number" id="iv" inputmode="numeric" value="${cur}"><div class="row" style="margin-top:10px"><span>現在の残高</span><b>${yen(bal(id))}</b></div><button class="ok" id="isv">設定する</button><button class="ok cl" id="ixx">キャンセル</button>`;$('d2').classList.add('on');
 $('isv').onclick=()=>{S.init=S.init||{};S.init[id]=Math.round(+$('iv').value)||0;touch('init:'+id);save();render();$('d2').classList.remove('on')};
 $('ixx').onclick=()=>$('d2').classList.remove('on')}
function iconMenu(k){const has=!!S.icons[k];$('s2').innerHTML=`<h2>アイコンの設定</h2><button class="ok" id="ia">A: アイコン画像を設定／再設定</button><button class="ok" id="ib" style="background:#d12c2c;${has?'':'opacity:.4'}">B: アイコン画像を削除</button><button class="ok cl" id="ix">キャンセル</button>`;$('d2').classList.add('on');
 $('ia').onclick=()=>{iconTarget=k;$('d2').classList.remove('on');$('file').click()};
 $('ib').onclick=()=>{if(has){delete S.icons[k];touch('icon:'+k);save();render()}$('d2').classList.remove('on')};
 $('ix').onclick=()=>$('d2').classList.remove('on')}
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}if(f!==''||r.length){r.push(f);rows.push(r)}return rows}
function importCSV(id,buf){let tx;try{tx=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){tx=new TextDecoder('shift_jis').decode(buf)}
 const rows=parseCSV(tx.replace(/^\ufeff/,'')),hd=(rows[0]||[]).map(x=>x.trim()),ix=k=>hd.findIndex(h=>h.includes(k)),iS=ix('ご利用店名'),iD=ix('ご利用日'),iA=ix('ご利用金額');
 if(iS<0||iD<0||iA<0)return msg('読み込めない形式です。ラベル行に「ご利用店名」「ご利用日」「ご利用金額」が必要です。');
 const key=(d,ty,a,s)=>[d,ty,a,s].join('|'),have={};S.tx.filter(t=>t.acct===id).forEach(t=>{const k=key(t.date,t.type,t.amount,t.shop||'');have[k]=(have[k]||0)+1});
